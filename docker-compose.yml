version: '3.8'
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_research_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, retries: 5 }

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]

  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/ai_research_agent
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:${DB_PASSWORD:-postgres}@db:5432/ai_research_agent
      OLLAMA_BASE_URL: http://ollama:11434
      SECRET_KEY: ${SECRET_KEY:-change-in-prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-jwt-in-prod}
      CORS_ORIGINS: '["http://localhost"]'
    volumes: [faiss_data:/app/faiss_index, uploads:/app/uploads]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80"]

volumes: { pgdata: null, ollama_data: null, faiss_data: null, uploads: null }
